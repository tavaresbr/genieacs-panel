# Varredura de segredos (gitleaks) e análise estática (CodeQL).
#
# Separado do `ci.yml` de propósito: os jobs de lá continuam exatamente como
# estavam, e estes dois entram como NÃO obrigatórios (`continue-on-error`)
# enquanto o primeiro lote de achados é triado — ver docs/seguranca-auditoria.md.
# Quando a base estiver limpa, tirar o `continue-on-error` e marcar os dois como
# checks obrigatórios na proteção da `main`.
#
# As actions vão fixadas por SHA, como no resto do CI; o dependabot
# (`.github/dependabot.yml`, ecossistema github-actions) mantém os pins.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal, para pegar consulta nova do CodeQL mesmo sem commit.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # O histórico inteiro: um segredo apagado no commit seguinte continua
          # no repositório, e é justamente esse que interessa achar.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comentário no PR desligado: o job é informativo por enquanto, e o
          # relatório sai como artefato do próprio job.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # JavaScript/TypeScript não precisa de build: a extração lê o fonte.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:javascript-typescript'
