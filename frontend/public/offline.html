<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Sem conexão</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f5f1; color: #1d2a26; padding: 24px; box-sizing: border-box; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #121614; color: #e8e6df; } }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { margin: 0 0 8px; line-height: 1.5; opacity: .8; }
      a { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 8px; background: #173f35; color: #f4f3ed; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Sem conexão com o painel</h1>
      <p>Verifique a internet deste aparelho e tente de novo.</p>
      <p lang="en">You are offline. Check this device's connection and try again.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
